<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StockView</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #111118;
            --border: #1e1e2e;
            --accent: #00ff88;
            --accent2: #0099ff;
            --warn: #ffcc00;
            --danger: #ff4466;
            --text: #e0e0f0;
            --muted: #555570;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Syne', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Animated grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
        }

        .hero {
            position: relative;
            z-index: 1;
            text-align: center;
            animation: fadeUp 0.8s ease both;
        }

        .logo {
            font-size: 0.75rem;
            letter-spacing: 0.4em;
            color: var(--accent);
            font-family: 'Space Mono', monospace;
            margin-bottom: 1.5rem;
            opacity: 0.8;
        }

        h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 800;
            line-height: 1;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #fff 30%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--muted);
            font-size: 1rem;
            margin-bottom: 3rem;
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
        }

        .search-box {
            display: flex;
            gap: 0;
            max-width: 480px;
            width: 90vw;
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
            transition: border-color 0.2s;
            background: var(--surface);
        }

        .search-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0,255,136,0.08);
        }

        input[type="text"] {
            flex: 1;
            padding: 1rem 1.25rem;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-family: 'Space Mono', monospace;
            font-size: 0.95rem;
            letter-spacing: 0.05em;
        }

        input::placeholder { color: var(--muted); }

        button[type="submit"] {
            padding: 1rem 1.5rem;
            background: var(--accent);
            color: #000;
            border: none;
            cursor: pointer;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            transition: background 0.2s, transform 0.1s;
        }

        button[type="submit"]:hover { background: #00e07a; }
        button[type="submit"]:active { transform: scale(0.97); }

        .tickers {
            margin-top: 2rem;
            display: flex;
            gap: 0.6rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .ticker-pill {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            padding: 0.3rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .ticker-pill:hover {
            border-color: var(--accent);
            color: var(--accent);
            cursor: pointer;
        }

        nav {
            position: fixed;
            top: 1.5rem;
            right: 2rem;
            z-index: 10;
        }

        nav a {
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            color: var(--muted);
            text-decoration: none;
            letter-spacing: 0.1em;
            transition: color 0.2s;
        }

        nav a:hover { color: var(--accent); }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <nav><a href="/about">ABOUT</a></nav>

    <div class="hero">
        <p class="logo">▸ STOCKVIEW TERMINAL</p>
        <h1>Know Your<br>Next Move.</h1>
        <p class="subtitle">// real-time analytics · valuation signals · financials</p>

        <form action="/search" method="POST">
            <div class="search-box">
                <input type="text" name="ticker" placeholder="Enter ticker — AAPL, TSLA, SPY..." autocomplete="off" autofocus>
                <button type="submit">SEARCH →</button>
            </div>
        </form>

        <div class="tickers" id="defaultTickers">
            <span class="ticker-pill">AAPL</span>
            <span class="ticker-pill">TSLA</span>
            <span class="ticker-pill">MSFT</span>
            <span class="ticker-pill">SPY</span>
            <span class="ticker-pill">NVDA</span>
            <span class="ticker-pill">AMZN</span>
        </div>

        <div id="watchlistSection" style="display:none; margin-top:2rem;">
            <p style="font-family:'Space Mono',monospace; font-size:0.65rem; color:var(--muted); letter-spacing:0.2em; margin-bottom:0.75rem;">// WATCHLIST</p>
            <div class="tickers" id="watchlistPills"></div>
        </div>
    </div>

    <script>
        function submitTicker(ticker) {
            const input = document.querySelector('input[name="ticker"]');
            input.value = ticker;
            input.closest('form').submit();
        }

        document.querySelectorAll('.ticker-pill').forEach(pill => {
            pill.addEventListener('click', () => submitTicker(pill.textContent));
        });

        // Watchlist
        const watchlist = JSON.parse(localStorage.getItem('stockview_watchlist') || '[]');
        if (watchlist.length > 0) {
            const section = document.getElementById('watchlistSection');
            const container = document.getElementById('watchlistPills');
            watchlist.forEach(item => {
                const pill = document.createElement('span');
                pill.className = 'ticker-pill';
                pill.textContent = item.ticker;
                pill.title = item.name;
                pill.addEventListener('click', () => submitTicker(item.ticker));
                container.appendChild(pill);
            });
            section.style.display = 'block';
        }
    </script>
</body>
</html>
