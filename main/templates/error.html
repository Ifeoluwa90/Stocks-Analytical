<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StockView — Error</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #111118;
            --border: #1e1e2e;
            --accent: #00ff88;
            --danger: #ff4466;
            --text: #e0e0f0;
            --muted: #555570;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Syne', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 480px;
            padding: 2rem;
        }
        .label {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.4em;
            color: var(--danger);
            margin-bottom: 1.5rem;
        }
        h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 1rem;
            color: var(--text);
        }
        .ticker {
            font-family: 'Space Mono', monospace;
            color: var(--danger);
        }
        .message {
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }
        .back-btn {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: var(--accent);
            color: #000;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            text-decoration: none;
            border-radius: 2px;
            transition: background 0.2s;
        }
        .back-btn:hover { background: #00e07a; }
    </style>
</head>
<body>
    <div class="container">
        <p class="label">▸ ERROR</p>
        <h1>
            {% if ticker %}<span class="ticker">{{ ticker }}</span><br>{% endif %}
            Not Found.
        </h1>
        <p class="message">{{ message }}</p>
        <a href="/" class="back-btn">← TRY AGAIN</a>
    </div>
</body>
</html>
